<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음을 담은 편지</title>
<style>
  :root { --wood-dark:#59351f; --wood-mid:#98633d; --wood-light:#c28c5e; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; min-height:100%; }
  body {
    min-height:100vh; overflow:hidden; display:grid; place-items:center;
    background-color:#95613d;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(255,224,173,.18), transparent 38%),
      radial-gradient(ellipse at 82% 72%, rgba(62,30,12,.22), transparent 42%),
      repeating-linear-gradient(2deg, transparent 0 38px, rgba(66,34,16,.20) 39px, rgba(255,220,169,.10) 42px, transparent 48px 82px),
      repeating-linear-gradient(90deg, #a8754c 0 2px, #b98457 2px 110px, #9b6943 112px 115px, #c18a5b 116px 225px);
    background-attachment:fixed;
    font-family: Georgia, "Noto Serif KR", serif;
  }
  .scene { width:min(100vw, 900px); height:min(100vh, 760px); min-height:500px; position:relative; display:grid; place-items:center; perspective:1200px; }
  .hint { position:absolute; top:clamp(22px,6vh,56px); left:20px; right:20px; text-align:center; color:#fff3df; text-shadow:0 2px 5px #4c2c19; font-size:clamp(14px,2vw,18px); letter-spacing:.08em; }
  .envelope-wrap { position:relative; width:min(76vw, 390px); height:260px; margin-top:45px; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; }
  .envelope-wrap:focus-visible { filter:drop-shadow(0 0 0.4rem #fff1d0); }
  .shadow { position:absolute; left:5%; right:5%; bottom:-17px; height:38px; background:rgba(42,21,10,.38); filter:blur(16px); border-radius:50%; }
  .letter {
    position:absolute; z-index:2; left:7%; width:86%; height:100%; bottom:0px;
    aspect-ratio: 779 / 549; object-fit:contain; background:#fffaf0;
    border:1px solid rgba(93,63,38,.2); box-shadow:0 4px 15px rgba(45,25,12,.22);
    transform:translateY(0) scale(.98); transform-origin:center bottom;
    transition:transform 1.35s cubic-bezier(.2,.72,.18,1), bottom 1.35s cubic-bezier(.2,.72,.18,1);
    pointer-events:none;
  }
  .back {
    position:absolute; inset:0; z-index:1; overflow:hidden; border-radius:4px 4px 12px 12px;
    background:linear-gradient(145deg,#f5e8ce,#e5d0ad); box-shadow:0 18px 30px rgba(50,25,10,.28), inset 0 0 0 1px rgba(119,78,41,.2);
  }
  .back:before { content:""; position:absolute; inset:0; background:linear-gradient(135deg, transparent 49.7%, rgba(173,128,77,.25) 50%, transparent 50.5%); }
  .pocket {
    position:absolute; inset:0; z-index:4; overflow:hidden;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%);
    background:linear-gradient(150deg,#f8ecd5,#e9d6b6);
  }
  .pocket:before { content:""; position:absolute; inset:0; background:linear-gradient(32deg, #dfc39a 0%, #f4e4c7 49%, transparent 49.5%); clip-path:polygon(0 0,100% 0,50% 100%); }
  .pocket:after { content:""; position:absolute; inset:0; background:linear-gradient(145deg,#f7e8cc,#e3c89f); clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%); border-top:1px solid rgba(151,103,55,.18); }
  .flap {
    position:absolute; z-index:5; left:0; top:0; width:100%; height:62%;
    background:linear-gradient(180deg,#f8ecd5,#e6cda7);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:50% 0%; transform:rotateX(0deg);
    transition:transform .8s cubic-bezier(.2,.7,.2,1), z-index 0s .4s;
    filter:drop-shadow(0 2px 2px rgba(97,60,28,.13));
  }
  .seal { position:absolute; z-index:6; left:50%; top:42%; transform:translate(-50%,-50%); width:43px; height:43px; border-radius:50%; display:grid; place-items:center; color:#f9e7c8; font-size:21px; background:radial-gradient(circle at 35% 28%,#c98268,#8f4535 75%); box-shadow:0 3px 7px #70442d55; transition:opacity .25s, transform .3s; }
  .opened .flap { transform:rotateX(180deg); z-index:1; }
  .opened .seal { opacity:0; transform:translate(-50%,-50%) scale(.6); }
  .revealed .letter { bottom:210px; transform:translateY(-8px) scale(1.04); transition-delay:.05s; }
  .opened .letter { transition-delay:0s; }
  .envelope-wrap:not(.opened):hover { transform:translateY(-3px); }
  .envelope-wrap { transition:transform .25s ease; }
  .caption { position:absolute; bottom:clamp(26px,6vh,55px); color:#fff2de; text-shadow:0 2px 5px #4c2c19; font-size:13px; letter-spacing:.12em; opacity:.9; }
  .opened + .caption { opacity:0; }
  .replay { position:absolute; bottom:20px; right:20px; border:1px solid #fff0d0aa; border-radius:999px; padding:10px 15px; color:#fff3df; background:#4d2b1a55; font:inherit; cursor:pointer; display:none; backdrop-filter:blur(5px); }
  .replay:hover { background:#4d2b1a99; }
  .scene.done .replay { display:block; }
  @media (max-width:520px) {
    .scene { min-height:520px; }
    .envelope-wrap { width:84vw; height:220px; }
    .revealed .letter { bottom:178px; }
    .seal { width:37px; height:37px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *:before, *:after { transition-duration:.01ms !important; } }
</style>
</head>

  <button class="replay" id="replay" type="button">다시 봉투에 담기</button>
</main>
<script>
(() => {
  const envelope = document.getElementById('envelope');
  const scene = document.getElementById('scene');
  const replay = document.getElementById('replay');
  const caption = document.getElementById('caption');
  let opened = false;
  let stage = 0; // 0: sealed, 1: envelope open, 2: letter fully raised
  function setStage(nextStage) {
    stage = nextStage;
    opened = stage > 0;
    envelope.classList.toggle('opened', stage > 0);
    envelope.classList.toggle('revealed', stage > 1);
    envelope.setAttribute('aria-expanded', String(stage > 0));
    envelope.setAttribute('aria-label', stage === 0 ? '편지봉투 열기' : stage === 1 ? '편지 꺼내기' : '처음부터 다시 보기');
    scene.classList.toggle('done', stage > 0);
    caption.textContent = stage === 0 ? '봉투를 눌러 편지를 열어보세요' :
      stage === 1 ? '한 번 더 눌러 편지를 꺼내보세요' : '편지를 읽어보세요';
  }
  function advance() { setStage(stage === 0 ? 1 : stage === 1 ? 2 : 0); }
  envelope.addEventListener('click', advance);
  envelope.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); }
  });
  replay.addEventListener('click', () => setStage(0));
})();
</script>
